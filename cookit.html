  <script>
    // Simple accessible hamburger behaviour
    (function(){
      const toggle = document.querySelector('.nav-toggle');
      const mobile = document.getElementById('mobile-menu');
      const closeBtn = mobile.querySelector('.close-btn');
      const links = mobile.querySelectorAll('.nav-list a');

      function openMenu(){
        mobile.style.display = 'block';
        mobile.setAttribute('aria-hidden','false');
        toggle.setAttribute('aria-expanded','true');
        document.body.style.overflow = 'hidden';
        setTimeout(()=> mobile.querySelector('.nav-list a')?.focus(), 50);
      }
      function closeMenu(){
        mobile.style.display = 'none';
        mobile.setAttribute('aria-hidden','true');
        toggle.setAttribute('aria-expanded','false');
        document.body.style.overflow = '';
        toggle.focus();
      }

      toggle.addEventListener('click', openMenu);
      closeBtn.addEventListener('click', closeMenu);
      links.forEach(a => a.addEventListener('click', closeMenu));
      document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenu(); });
    })();
  </script>

// --- Force "Projects" nav active on load ---
document.addEventListener("DOMContentLoaded", () => {
  const links = document.querySelectorAll(".nav-list a");

  // find link that includes 'projects' in its href

    <script>
    (() => {
      const btn = document.getElementById('projectShareBtn');
      if (!btn) return;
      const label = btn.innerHTML;
      const toast = (msg) => {
        btn.textContent = msg;
        setTimeout(() => { btn.innerHTML = label; }, 1200);
      };
      const copyLink = async () => {
        try {
          await navigator.clipboard.writeText(location.href);
          toast('Copied');
        } catch {
          toast('Share');
        }
      };
      btn.addEventListener('click', async () => {
        if (navigator.share) {
          try {
            await navigator.share({ title: document.title, text: 'Check out this project', url: location.href });
            return;
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
        }
        await copyLink();
      });
    })();
  </script>
