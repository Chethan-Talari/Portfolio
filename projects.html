  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Special+Elite&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --wrap: 1200px; --muted: #6b6b6b; }
    body { margin:0; font-family:'Inter', sans-serif; background:#fff; color:#111; }
    main { max-width: var(--wrap); margin:0 auto; padding:0 28px; }

    h1 {
      font-family:'Bebas Neue', sans-serif;
      font-size: 60px;
      letter-spacing:-1px;
      margin: 48px 0 8px;
    }
    p.subtitle {
      color: var(--muted);
      margin-bottom: 32px;
    }

.header-inner{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.site-nav {
  position:relative;
  display:flex;
  align-items:center;
}


    /* Tabs */
    .project-tabs {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-bottom:32px;
    }
    .tab {
      padding:8px 14px;
      border:1px solid rgba(0,0,0,0.08);
      border-radius:6px;
      cursor:pointer;
      font-size:14px;
      background:#fff;
      transition:all .2s ease;
    }
    .tab.active {
      background:#111;
      color:#fff;
      border-color:#111;
    }
    .tab:hover { background:#f5f5f5; }

    /* Grid + cards */
    .projects-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
      gap:28px;
      margin-bottom:80px;
    }
    .project-card {
      display:block;
      text-decoration:none;
      color:inherit;
      border-radius:8px;
      overflow:hidden;
      border:1px solid #eee;
      background:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,0.05);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .project-card:hover {
      transform:translateY(-4px);
      box-shadow:0 18px 40px rgba(0,0,0,0.08);
    }
    .project-thumb {
      width:100%;
      aspect-ratio:16/9;
      background-size:cover;
      background-position:center;
    }
    .project-info {
      padding:14px 16px;
    }
    .project-info h4 {
      margin:0 0 6px;
      font-size:17px;
      font-weight:600;
    }
    .project-info p {
      margin:0;
      color:#777;
      font-size:14px;
    }

    footer.site-footer { margin-top:60px; padding:24px 0; border-top:1px solid #efefef; background:#fff; }
    footer .footer-inner { max-width:var(--wrap); margin:0 auto; padding:0 28px; display:flex; justify-content:space-between; align-items:center; gap:16px; }

    @media (max-width:640px){
      main { padding:0 20px; }
      h1 { font-size:46px; }
    }
  </style>

<body>

<!-- ===== START: Responsive header (copy into each page) ===== -->
<header class="site-header">
  <style>
    /* Minimal header styles (self-contained) */
    :root {
      --accent:#111;
      --muted:#666;
      --touch:48px;
    }
    .site-header { border-bottom:1px solid rgba(0,0,0,0.06); background:#fff; }
    .site-header .container { max-width:1200px; margin:0 auto; padding:18px 32px; display:flex; align-items:center; justify-content:space-between; gap:12px; box-sizing:border-box; }

    .site-logo img { height:36px; display:block; }

    .nav-list { list-style:none; margin:0; padding:0; display:flex; gap:28px; align-items:center; }
    .nav-list a { text-decoration:none; color:var(--accent); font-weight:600; padding:6px 0; }

    /* hamburger toggle (hidden on desktop) */
    .nav-toggle { display:none; width:var(--touch); height:var(--touch); align-items:center; justify-content:center; border-radius:8px; border:1px solid rgba(0,0,0,0.04); background:transparent; cursor:pointer; }

    /* mobile menu overlay (hidden by default) */
    .mobile-menu { display:none; position:fixed; inset:0; background:#fff; padding:80px 20px 20px; z-index:9999; overflow:auto; }
    .mobile-menu .nav-list { flex-direction:column; gap:18px; }

    /* responsive breakpoints */
    @media (max-width: 768px) {
      .site-header .container { padding:14px 20px; }
      .nav-list { display:none; }             /* hide desktop nav */
      .nav-toggle { display:flex; }           /* show hamburger */
      .site-logo img { height:32px; }
      :root { --touch:44px; }
    }
  </style>

  <div class="container">
    <a href="index.html" class="site-logo" aria-label="Home"><img src="assets/logo-black.png" alt="Logo"></a>

    <nav aria-label="Main navigation">
      <ul class="nav-list" role="menubar">
        <li><a href="index.html">Home</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="connect.html">Connect</a></li>
      </ul>

      <button class="nav-toggle" aria-controls="mobile-menu" aria-expanded="false" aria-label="Open menu">
        <!-- hamburger icon -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="#111" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </nav>
  </div>

  <div id="mobile-menu" class="mobile-menu" aria-hidden="true" role="dialog" aria-modal="true">
    <button class="close-btn" aria-label="Close menu" style="position:absolute;right:14px;top:18px;border:none;background:#fff;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M6 6l12 12M6 18L18 6" stroke="#111" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>

    <nav aria-label="Mobile navigation">
      <ul class="nav-list" role="menu" style="margin-top:8px;">
        <li><a role="menuitem" href="index.html">Home</a></li>
        <li><a role="menuitem" href="projects.html">Projects</a></li>
        <li><a role="menuitem" href="about.html">About</a></li>
        <li><a role="menuitem" href="connect.html">Connect</a></li>
      </ul>
    </nav>
  </div>

  <script>
    // Simple accessible hamburger behaviour
    (function(){
      const toggle = document.querySelector('.nav-toggle');
      const mobile = document.getElementById('mobile-menu');
      const closeBtn = mobile.querySelector('.close-btn');
      const links = mobile.querySelectorAll('.nav-list a');

      function openMenu(){
        mobile.style.display = 'block';
        mobile.setAttribute('aria-hidden','false');
        toggle.setAttribute('aria-expanded','true');
        document.body.style.overflow = 'hidden';
        setTimeout(()=> mobile.querySelector('.nav-list a')?.focus(), 50);
      }
      function closeMenu(){
        mobile.style.display = 'none';
        mobile.setAttribute('aria-hidden','true');
        toggle.setAttribute('aria-expanded','false');
        document.body.style.overflow = '';
        toggle.focus();
      }

      toggle.addEventListener('click', openMenu);
      closeBtn.addEventListener('click', closeMenu);
      links.forEach(a => a.addEventListener('click', closeMenu));
      document.addEventListener('keydown', e => { if(e.key === 'Escape') closeMenu(); });
    })();
  </script>
</header>
<!-- ===== END: Responsive header ===== -->



  <!-- MAIN -->

  <!-- SCRIPT -->
  <script>
    /* === PROJECT DATA ===
       Update these entries or add more projects. Ensure `image` paths are correct.
    */
    const projects = [
      { title: "Awara - UI/UX Design", category: "UX Design", year: "2025", image: "assets/projects/awara/cover.jpg", link: "awara.html" },
      { title: "Cook It - Recipe App", category: "UX Design", year: "2023", image: "assets/projects/cookit/cover.jpg", link: "cookit.html" },
      { title: "Bookafe - Online App", category: "UX Design", year: "2023", image: "assets/projects/bookafe/cover.jpg", link: "bookafe.html" },
      { title: "Prachi - Brand Identity", category: "Brand Design", year: "2024", image: "assets/projects/prachi/cover.jpg", link: "prachi.html" },
      { title: "Sparsha - Brand Identity", category: "Brand Design", year: "2024", image: "assets/projects/sparsha/cover.jpg", link: "sparsha.html" },
      { title: "Samarth - Central Silk Board", category: "Visual Stories", year: "2025", image: "assets/projects/samarth/cover.png", link: "samarth.html" },
      { title: "Toda Embroidery", category: "Research", year: "2025", image: "assets/projects/toda/cover.jpg", link: "toda.html" },
      
      // add more project objects here as needed...
    ];

    const grid = document.getElementById('projectsGrid');
    const tabs = Array.from(document.querySelectorAll('.tab'));

    // Normalize category string for comparisons
    function normalizeCat(s){ return (s||'').toString().trim().toLowerCase(); }

    // Render project cards for given category filter ('all' or category text)
    function renderProjects(filter) {
      grid.innerHTML = '';
      const norm = normalizeCat(filter);
      const list = norm === 'all' ? projects : projects.filter(p => normalizeCat(p.category).includes(norm));
      if (!list.length) {
        const empty = document.createElement('div');
        empty.style.gridColumn = '1/-1';
        empty.style.color = '#777';
        empty.style.padding = '28px 20px';
        empty.textContent = 'No projects found.';
        grid.appendChild(empty);
        return;
      }
      list.forEach(p => {
        const a = document.createElement('a');
        a.className = 'project-card';
        a.href = p.link || '#';
        a.innerHTML = `
          <div class="project-thumb" style="background-image:url('${p.image}')"></div>
          <div class="project-info">
            <h4>${p.title}</h4>
            <p>${p.category} · ${p.year}</p>
          </div>
        `;
        grid.appendChild(a);
      });
    }

    // Set UI/UX as the default active tab and ensure View All is last visually (we already arranged order in markup)
    function activateDefault() {
      // find UI/UX tab or fallback to 'all'
      const uiux = tabs.find(t => normalizeCat(t.dataset.cat) === 'ui/ux' || normalizeCat(t.dataset.cat).includes('ui'));
      const defaultTab = uiux || tabs.find(t => t.dataset.cat === 'all');
      tabs.forEach(t => t.classList.remove('active'));
      if (defaultTab) {
        defaultTab.classList.add('active');
        renderProjects(defaultTab.dataset.cat);
      } else {
        // safety fallback
        tabs[0].classList.add('active');
        renderProjects(tabs[0].dataset.cat);
      }
    }

    // Tab click handlers
    tabs.forEach(t => {
      t.addEventListener('click', (e) => {
        tabs.forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        renderProjects(t.dataset.cat);
        // small scroll so content is visible after clicking
        setTimeout(()=>{ window.scrollTo({ top: document.querySelector('main').offsetTop, behavior: 'smooth' }); }, 80);
      });
    });

    // Initialize
    activateDefault();
  </script>
