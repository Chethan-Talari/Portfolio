<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <style>
    :root { --bg:#f7f6f3; --ink:#161616; --muted:#6a6a6a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Poppins", sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 56px 24px; }
    .back { display: inline-block; margin-bottom: 24px; color: var(--ink); text-decoration: none; border-bottom: 1px solid transparent; }
    .back:hover { border-color: var(--ink); }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 48px); }
    p { margin: 0; color: var(--muted); line-height: 1.7; max-width: 70ch; }
    .card { margin-top: 28px; background: #fff; border: 1px solid rgba(0,0,0,0.08); border-radius: 14px; padding: 22px; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="projects.html">Back to Projects</a>

    </section>
  </main>
